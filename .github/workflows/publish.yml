name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm for Trusted Publishing
        run: npm install -g npm@latest

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "Tag v${TAG} does not match package.json version ${VERSION}"
            exit 1
          fi

      - name: Verify package is reachable on the registry
        run: |
          PKG=$(node -p "require('./package.json').name")
          ENCODED=$(node -p "encodeURIComponent(require('./package.json').name)")
          if ! curl -fsSL "https://registry.npmjs.org/${ENCODED}" -o /dev/null; then
            echo "::error::Package '${PKG}' is not reachable on the npm registry."
            echo ""
            echo "This usually means the npm Trusted Publisher hasn't been configured yet."
            echo "Go to: https://www.npmjs.com/package/${PKG}/settings/trusted-publishers"
            echo ""
            echo "Required values:"
            echo "  - Provider: GitHub Actions"
            echo "  - Organization: pinoox"
            echo "  - Repository: slug"
            echo "  - Workflow filename: publish.yml"
            echo "  - Environment name: npm"
            echo "  - Allowed actions: npm publish"
            exit 1
          fi
          echo "Package ${PKG} is reachable on the registry."

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm (Trusted Publisher)
        run: npm publish --provenance --access public
